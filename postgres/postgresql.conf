# Static production defaults. Environment-driven values (memory, connections, WAL size...)
# are generated at container start into /etc/postgresql/conf.d/10-env.conf.

# --- Connections ---------------------------------------------------------
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.conf'
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
idle_in_transaction_session_timeout = '10min'

# --- Security ------------------------------------------------------------
password_encryption = 'scram-sha-256'
ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file = '/etc/postgresql/certs/server.key'
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on
ssl_ciphers = 'HIGH:!aNULL:!MD5:!3DES'

# --- WAL / archiving / replication --------------------------------------
wal_level = replica
wal_compression = on
wal_log_hints = on
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push "%p"'
archive_timeout = 60
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
min_wal_size = '1GB'

# --- Planner (assumes SSD/NVMe, which is what VPS providers ship) --------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Extensions ----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements,pgaudit'
pg_stat_statements.track = all
pgaudit.log = 'ddl,role'
pgaudit.log_catalog = off

# --- Statistics ----------------------------------------------------------
track_io_timing = on
track_functions = pl

# --- Logging: stderr only, so `docker logs` / Dokploy / Coolify just work -
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_connections = on
log_disconnections = on
log_checkpoints = on
log_lock_waits = on
log_temp_files = '10MB'
log_autovacuum_min_duration = '1s'
log_timezone = 'UTC'
timezone = 'UTC'

include_if_exists = '/etc/postgresql/conf.d/10-env.conf'
